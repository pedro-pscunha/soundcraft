[package]
name = "soundcraft-au-host"
description = "SoundCraft Audio Unit (AUv2, macOS) plugin host: lists, loads and runs system-registered Audio Units behind the safe soundcraft-dsp Plugin trait (an isolated unsafe FFI crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Test-only API for the main-thread editor test (never on in the app).
testing = []

[dependencies]
soundcraft-dsp.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true

# Audio Unit views in SoundCraft's plugin window (soundcraft-macos). `relax-void-encoding`: an
# `AudioUnit` is passed to view factories as `*mut c_void`, whatever pointer type each factory's
# method encoding names.
[target.'cfg(target_os = "macos")'.dependencies]
soundcraft-macos.workspace = true
objc2 = { version = "0.6", features = ["exception", "relax-void-encoding"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView"] }

[dev-dependencies]
soundcraft-au-host = { path = ".", features = ["testing"] }

# The editor test checks the process's windows (none may reach the screen).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSGeometry", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow"] }

[[test]]
name = "editor_main_thread"
harness = false

# An isolated unsafe helper crate (craftrules never-crash), like soundcraft-vst3-host: this crate
# opts out of the workspace `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere
# and allows it solely on the FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
