[package]
name = "soundcraft-vst3-host"
description = "SoundCraft VST3 plugin host: scans, loads and runs third-party VST3 plugins behind the safe soundcraft-dsp Plugin trait (an isolated unsafe FFI crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Test seams for the main-thread editor test (never on in the app).
testing = []

[dependencies]
soundcraft-dsp.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vst3 = "0.3"
libloading = "0.8"

# The macOS editor host window: SoundCraft's plugin window (soundcraft-macos), whose content view
# the plugin's IPlugView attaches to.
[target.'cfg(target_os = "macos")'.dependencies]
soundcraft-macos.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

# The Windows editor host window (a top-level HWND the plugin view's child window lives in).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
soundcraft-vst3-host = { path = ".", features = ["testing"] }

# The editor test checks the process's windows (none may reach the screen) and keeps the plugin
# window off screen when it raises it (soundcraft-macos's test seams).
[target.'cfg(target_os = "macos")'.dev-dependencies]
soundcraft-macos = { workspace = true, features = ["testing"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }

[[test]]
name = "editor_main_thread"
harness = false

[[test]]
name = "module_exit"
harness = false

[[test]]
name = "module_exit_live_instance"
harness = false

[[test]]
name = "module_exit_worker_thread"
harness = false

[[test]]
name = "module_exit_shutdown"
harness = false

# An isolated unsafe helper crate (craftrules never-crash), like soundcraft-clap-host: this crate
# opts out of the workspace `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere
# and allows it solely on the FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
